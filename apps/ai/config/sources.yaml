# Discovery runs: per-run budgets, the match threshold and where agents search.
#
# Budgets are hard limits. A run that reaches one stops and finishes as "partial"
# with what it has, never as a crash.
version: 1

discovery:
  # Candidates scoring below this (0-100) are not added to the opportunity feed.
  match_threshold: 55
  # How thorough a run is: each depth is a set of hard limits plus the number of
  # plan → search → read → judge rounds (a new round happens only when fewer than
  # target_results were added and budget is left). max_searches counts search calls
  # of any source (each Tavily search = 1 request); max_pages counts listings read by
  # the verifier; max_tokens counts model tokens across all agents.
  default_depth: standard
  depths:
    quick:
      label: Quick
      description: A fast first look.
      max_searches: 6
      max_pages: 15
      max_tokens: 80000
      max_wall_seconds: 240
      max_rounds: 1
    standard:
      label: Standard
      description: Balanced; the usual choice.
      max_searches: 12
      max_pages: 40
      max_tokens: 200000
      max_wall_seconds: 600
      max_rounds: 2
    deep:
      label: Deep
      description: Wider and slower; more finds.
      max_searches: 24
      max_pages: 80
      max_tokens: 400000
      max_wall_seconds: 900
      max_rounds: 3
  target_results: 5
  results_per_search: 8
  # Leads the researcher may send to the verifier per round.
  max_leads_per_round: 15
  # Results from official tender portals (whole records, nothing to fetch) are all
  # read, up to this many per round, without taking the researcher's picks.
  max_portal_reads_per_round: 12
  # Page text sent to the verifier is cut to this many characters.
  max_page_chars: 12000
  # Pages read and scored in parallel. Keep it low on Groq's free tier.
  max_concurrency: 4
  # The organization's most similar past approve/reject decisions shown to the judge.
  decision_memory_size: 4

# Concrete sources. `adapter` names the implementation (apps/ai/tools/sources);
# `covers` tells the supervisor what a source is good for; `enabled: false` turns
# one off without touching code.
sources:
  web_search:
    adapter: tavily
    domain: the web
    covers: Any country or opportunity type; calls for proposals, grants, tenders and partnerships published anywhere online.
  news_search:
    adapter: tavily
    domain: news sites
    covers: Recent announcements of funding rounds, prizes and partnership calls.
    options: {topic: news, days: 45}
  grants_gov:
    adapter: grants_gov
    domain: grants.gov
    covers: US federal grants. Mostly for US organizations; some programmes accept international applicants.
  world_bank:
    adapter: world_bank
    domain: worldbank.org
    covers: World Bank-financed procurement in developing countries (goods, works and consulting firms); tenders and expressions of interest.
    # Individual consultant posts are jobs for a person, not calls for organizations.
    options: {exclude_methods: [Individual Consultant Selection]}
  eu_funding:
    adapter: eu_funding
    domain: ec.europa.eu
    covers: European Commission grants, calls for proposals and tenders (Horizon Europe, Digital Europe, Erasmus+, etc.).
  kenya_ppip:
    adapter: ppip
    domain: tenders.go.ke
    covers: Kenya's Public Procurement Information Portal — every open tender of Kenyan national ministries, county governments, state corporations, NG-CDF and public schools and universities (goods, works, services, consultancy). Search with plain words for what is bought ("software", "website", "ICT equipment"), not long phrases.
    options:
      max_pages: 10        # 100 tenders a page; a few hundred are open at a time
      timeout_seconds: 60
      page_pause_seconds: 1  # the portal allows 60 requests a minute
      cache_minutes: 30      # runs within this share one read of the portal
  kenya_gov_web:
    adapter: tavily
    domain: Kenyan government sites
    covers: Tender notices on Kenyan public bodies' own websites (.go.ke) — counties, parastatals and agencies that also advertise outside the national portal.
    options: {include_domains: [go.ke]}
  # Jobs: company career pages (public APIs, no keys) and Kenyan job boards.
  career_pages:
    adapter: careers
    domain: career pages
    covers: Jobs on companies' own career pages (Greenhouse, Lever, Ashby, Workable), including the companies the candidate follows. Search with job titles and skills, e.g. "backend developer python".
    options:
      cache_minutes: 30
      max_boards: 30
      workable_details: 15  # Workable lists no descriptions: each job's page is read too
      # Companies hiring in Kenya or remotely, read for every candidate. Add any board
      # as "greenhouse:<slug>", "lever:<slug>", "ashby:<slug>" or "workable:<slug>".
      boards:
        - greenhouse:moniepoint
        - greenhouse:branch
        - greenhouse:canonical
        - greenhouse:gitlab
        - greenhouse:turing
        - lever:tala
        - ashby:lemfi
        - ashby:ampersand
        - ashby:andela
        - ashby:zapier
        - workable:cellulant
        - workable:twiga-foods
        - workable:moniepoint
  kenya_job_boards:
    adapter: tavily
    domain: Kenyan job boards
    covers: Job adverts on Kenyan job boards (BrighterMonday, Fuzu, MyJobMag, Career Point Kenya). Search with a job title and a place, e.g. "data analyst Nairobi".
    options:
      include_domains: [brightermonday.co.ke, fuzu.com, myjobmag.co.ke, careerpointkenya.co.ke]
      # Its results are pages of many adverts: the best 2 are read (a page each and a
      # source_reader call) and up to 6 adverts taken from each.
      list_pages: 2
      adverts_per_page: 6
  ted_europa:
    adapter: ted_europa
    domain: ted.europa.eu
    covers: European public procurement and tenders (Tenders Electronic Daily) for contracts above EU thresholds.


  # Business directories: the Clients goal's sources. They return businesses, not
  # listings (apps/ai/tools/businesses). Searched once per kind of customer and place.
  google_maps:
    adapter: apify_google_maps
    domain: Google Maps (via Apify)
    covers: Businesses on Google Maps with phone, website, rating and reviews. Off unless APIFY_GOOGLE_MAPS_ENABLED is on (it scrapes Google Maps and uses Apify credit).
    options:
      actor: compass~crawler-google-places
      timeout_seconds: 240
      language: en
      # What to type into Google Maps for each kind of customer (BusinessCategory).
      search_terms:
        hospitality: hotels
        restaurants: restaurants
        health: clinics
        education: private schools
        legal: law firms
        professional: accounting firms
        real_estate: real estate agencies
        retail: shops
        beauty: beauty salons
        fitness: gyms
        automotive: car dealers
        logistics: logistics companies
        finance: saccos
        manufacturing: manufacturers
        agriculture: agribusiness
        construction: construction companies
        events: event venues
        travel: tour operators
        ngo: ngos
        religious: churches
        tech: software companies
        media: media agencies
  osm_places:
    adapter: overpass
    domain: OpenStreetMap
    covers: Businesses mapped on OpenStreetMap, free in any country. Names and places are good; phone numbers and websites are often missing, so a missing website there is no evidence the business has none.
    options:
      geocoder: https://nominatim.openstreetmap.org/search
      # Tried in order; public Overpass servers are often busy. On 2026-11-20 the
      # first two failed together while kumi.systems answered.
      endpoints:
        - https://overpass-api.de/api/interpreter
        - https://overpass.kumi.systems/api/interpreter
        - https://maps.mail.ru/osm/tools/overpass/api/interpreter
        - https://overpass.private.coffee/api/interpreter
      timeout_seconds: 60
      # OpenStreetMap tags for each kind of customer (BusinessCategory); "other" has none.
      tags:
        hospitality: ['"tourism"~"^(hotel|guest_house|motel|hostel|apartment)$"']
        restaurants: ['"amenity"~"^(restaurant|cafe|bar|fast_food|pub)$"']
        health: ['"amenity"~"^(clinic|hospital|pharmacy|dentist|doctors)$"', '"healthcare"']
        education: ['"amenity"~"^(school|college|university|kindergarten|language_school)$"']
        legal: ['"office"="lawyer"']
        professional: ['"office"~"^(accountant|consulting|tax_advisor)$"']
        real_estate: ['"office"="estate_agent"']
        retail: ['"shop"~"^(supermarket|clothes|boutique|shoes|electronics|mobile_phone|furniture|cosmetics|department_store)$"']
        beauty: ['"shop"~"^(hairdresser|beauty|massage)$"']
        fitness: ['"leisure"~"^(fitness_centre|sports_centre)$"']
        automotive: ['"shop"~"^(car|car_repair|car_parts|tyres)$"']
        logistics: ['"office"~"^(logistics|courier|moving_company)$"']
        finance: ['"office"~"^(financial|insurance|financial_advisor)$"', '"amenity"="bank"']
        manufacturing: ['"man_made"="works"', '"industrial"']
        agriculture: ['"shop"~"^(agrarian|farm)$"']
        construction: ['"shop"~"^(hardware|doityourself|trade)$"', '"craft"~"^(builder|carpenter)$"']
        events: ['"amenity"~"^(events_venue|conference_centre)$"']
        travel: ['"shop"="travel_agency"', '"office"="travel_agent"']
        ngo: ['"office"~"^(ngo|association|foundation|charity)$"']
        religious: ['"amenity"="place_of_worship"']
        tech: ['"office"~"^(it|telecommunication)$"']
        media: ['"office"~"^(advertising_agency|newspaper)$"', '"craft"="photographer"']

# Source categories an agent can pick (the UI's "sources"), each a group of sources.
source_categories:
  web:
    label: Open web
    sources: [web_search]
  grants:
    label: Grant databases
    sources: [grants_gov, eu_funding, web_search]
  procurement:
    label: Procurement portals
    sources: [kenya_ppip, kenya_gov_web, world_bank, ted_europa, web_search]
  news:
    label: News & announcements
    sources: [news_search]
  businesses:
    label: Business directories
    sources: [google_maps, osm_places]
  jobs:
    label: Career pages and job boards
    sources: [career_pages, kenya_job_boards]

# Client (business) searches; budgets come from the run's depth above.
clients:
  match_threshold: 40
  results_per_search: 20
  judge_batch_size: 8
  max_candidates: 40
  max_places: 3
  busy_reviews: 50
  # Lead lookup: before scoring, the best-listed businesses are looked up so each lead
  # shows how to reach it and why it needs you. One web search for a business with no
  # website listed (its site and social profiles), then its website read and checked:
  # down or a placeholder, HTTPS, set up for phones, copyright year, booking, chat and
  # payments, and its phone, email and social links. PageSpeed (mobile speed) runs only
  # when PAGESPEED_API_KEY is set.
  lookup:
    # Leads looked up per run, by depth. For client runs these lookups are added to the
    # depth's limits: one search and pages_per_lead pages each.
    leads: {quick: 8, standard: 20, deep: 40}
    pages_per_lead: 2  # the home page, then the contact page when it lacks a phone or email
    max_concurrency: 4
    # Lookups stop when only this many seconds of the run are left, for scoring and saving.
    reserve_seconds: 90
    # PageSpeed mobile performance (0-100) below this counts as a slow website.
    slow_below: 50
    pagespeed_timeout_seconds: 60
    # A copyright line this many years old (or older) counts as an outdated website.
    stale_after_years: 3
    # A link with one of these in its text or address leads to the contact page.
    contact_page_words: [contact, reach-us, find-us, get-in-touch, location, enquir]
    # Sites that are never a business's own website: directories, booking, review and
    # delivery sites, maps. "booking.com" matches that domain and its subdomains,
    # "tripadvisor." any of its country domains, and a word without a dot any host
    # containing it.
    not_own_site:
      - tripadvisor.
      - booking.com
      - expedia.
      - hotels.com
      - agoda.
      - trivago.
      - kayak.
      - airbnb.
      - yelp.
      - google.
      - goo.gl
      - wikipedia.org
      - wikimedia.org
      - linkedin.com
      - youtube.com
      - foursquare.com
      - mapquest.com
      - waze.com
      - cybo.com
      - businesslist.
      - yellow.co.ke
      - yellowpages
      - kenyabusinessdirectory
      - infoisinfo
      - zoominfo.com
      - dnb.com
      - opencorporates.com
      - glovoapp.com
      - ubereats.com
      - bolt.eu
      - jumia.
      - restaurantguru.com
      - eatout.co.ke
      - lonelyplanet.com
      - safaribookings.com
      - travelstart.
      - hotels.ng
      - trip.com
      - momondo.
      - skyscanner.
      - findglocal.com
      - waze.com
      - wanderlog.com
      - zomato.com
      - rocketreach.co
      - cbinsights.com
      - pitchbook.com
      - crunchbase.com
    # Words too common in business names to recognise a website by.
    generic_name_words:
      [the, and, of, at, by, ltd, limited, co, company, group, international, enterprises,
       services, africa, african, east, west, north, south, central, city, town, kenya,
       nairobi, mombasa, kisumu, nakuru, eldoret, hotel, hotels, lodge,
       inn, motel, hostel, resort, suites, guest, house, apartments, restaurant, cafe,
       coffee, bar, grill, lounge, kitchen, bistro, pub, club, clinic, medical, centre,
       center, hospital, pharmacy, chemist, school, academy, college, salon, spa, beauty,
       barber, shop, store, supermarket, gym, fitness]
    # Lowercase fragments of a page's HTML that show it has each feature.
    features:
      booking: [book now, book a room, book your stay, book a table, check availability,
                reservation, make a booking, order online, order now, add to cart,
                siteminder, cloudbeds, opentable, resdiary, eviivo, simplybook, calendly,
                type="date"]
      chat: [tawk.to, tidio, intercom, crisp.chat, drift.com, livechatinc, zopim,
             static.zdassets.com, js.hs-scripts.com, freshchat, botpress, manychat,
             chatbase, chatbot, landbot, voiceflow]
      payments: [paystack, flutterwave, stripe, pesapal, ipay, dpopay, 3gdirectpay,
                 checkout, woocommerce, shopify, mpesa express, stk push]
    # Rendering services for pages a plain fetch can't read (sites that refuse simple
    # clients or time out, and pages built by JavaScript), tried in order. Jina Reader
    # (JINA_API_KEY; works without one at a low rate), then Firecrawl (FIRECRAWL_API_KEY,
    # uses credits). Never used when a site's robots.txt keeps us out.
    renderers: [jina, firecrawl]
    # A page with less visible text than this is rendered, as JavaScript builds it.
    render_below_chars: 300
    # Hunter.io email lookups per run, for leads whose website shows no email. The free
    # plan has 50 a month (HUNTER_API_KEY); 0 turns it off.
    hunter_per_run: 5
    # Text that shows a placeholder instead of a website (counts as broken).
    placeholder_words: [domain is for sale, buy this domain, domain may be for sale,
                        coming soon, under construction, account suspended,
                        default web site page, index of /, parked free, website is expired]
