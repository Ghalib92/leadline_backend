[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "DJ",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Settings modules layer on `from .base import *`.
"config/settings/*" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"